[project]
name = "likeness"
version = "0.3.0"
description = "HakiShow：可以与你对话的个人图像工作室。包含手机形态的网页应用，以及负责执行任务的工作室服务器。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "私有，仅供个人使用" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "segno>=1.6",
]

[project.scripts]
likeness = "likeness.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx2>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["likeness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
